name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Project
      run: |
        cmd /c build.bat

    - name: Package Release
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $releaseRoot = "release_pkg"
        $dllRoot = Join-Path $releaseRoot "dll"
        New-Item -ItemType Directory -Force -Path $dllRoot | Out-Null

        Copy-Item bin\eiem.dll, bin\d3dcompiler_47.dll, bin\vulkan-1.dll, bin\eiem.ini, bin\LUA-LICENSE.txt, LICENSE, THIRD_PARTY_NOTICES -Destination $dllRoot
        Compress-Archive -Path "$dllRoot\*" -DestinationPath "EIEM_${tag}_dll.zip" -Force

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          EIEM_${{ github.ref_name }}_dll.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
